apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-ec2-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/iliusa77/argocd-crossplane.git
    targetRevision: main
    path: crossplane/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true